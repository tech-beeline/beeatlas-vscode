services:
  web-ide:
    build:
      context: .
      args:
        USER_UID: 1000
        USER_GID: 1000
    image: ghcr.io/tech-beeline/beeatlas-vscode:latest
    container_name: web-ide
    ports:
      - "8088:8080"
    environment:
      - PASSWORD=${PASSWORD:?PASSWORD is required}
      - WORKSPACE=${WORKSPACE:-workspace}
    volumes:
      # Монтируем папку с проектами
      - ./workspace:/home/vscode/workspace
      # Том для расширений (сохраняются между перезапусками)
      - ./vscode-extensions:/home/vscode/.local/share/code-server/extensions
      # Монтируем локальную папку с сертификатами (если есть)
      - ./certs:/certs:ro
    restart: unless-stopped
